<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OXP 2026 Agenda</title>
  <meta name="description" content="Odoo Experience 2026 — clean, filterable timetable">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23714B67'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3.2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try { const t = localStorage.getItem('oxp_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong>OXP 2026</strong>
          <span>Brussels Expo</span>
        </div>
      </div>

      <nav class="days" id="days" aria-label="Conference day"></nav>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search talks, speakers, rooms, tags…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>

      <div class="views" id="views" role="tablist" aria-label="View"></div>

      <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle theme (D)"></button>
    </header>

    <div class="filterbar" id="filterbar"></div>

    <main id="main" tabindex="-1"></main>
  </div>

  <div class="popover" id="popover" role="tooltip" hidden></div>
  <div class="menu" id="menu" hidden></div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Session details"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <button class="ai-fab" id="ai-fab" type="button" title="Ask AI about the agenda (A)" aria-label="Ask AI about the agenda">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 4.6 4.6 1.9-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z"/><path d="M18.5 15.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/></svg>
    <span>Ask AI</span>
  </button>
  <aside class="chat" id="chat" aria-hidden="true" aria-label="AI assistant">
    <div class="chat-bar">
      <span class="chat-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5l1.9 4.6 4.6 1.9-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z"/></svg></span>
      <div class="chat-head"><strong>Agenda assistant</strong><small id="chat-model">Knows all 484 sessions</small></div>
      <span class="sp"></span>
      <button class="icon-btn" type="button" data-chat="reset" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" type="button" data-chat="close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="chat-log" id="chat-log" aria-live="polite"></div>
    <form class="chat-form" id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="Ask about talks, speakers, rooms…" autocomplete="off"></textarea>
      <button class="chat-send" id="chat-send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    </form>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
